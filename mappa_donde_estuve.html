<style>
  :root{

    --mid: #c23b6b;
    --new: #f2a93b;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); font-family: 'Georgia', 'Times New Roman', serif; }
  #map { position:absolute; inset:0; background:#0b0f1a; }

  .title-panel{
    position:absolute; top:16px; left:16px; z-index:1000;
    background:var(--panel); backdrop-filter: blur(10px);
    border:1px solid var(--border); border-radius:10px;
    padding:16px 20px; max-width:300px; color:var(--text);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .title-panel h1{
    font-size:19px; margin:0 0 4px 0; font-weight:600; letter-spacing:0.3px;
  }
  .title-panel p{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:12px; color:var(--text-dim); margin:0; line-height:1.5;
  }
  .count-badge{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display:inline-block; margin-top:10px; font-size:11px; color:var(--text-dim);
    letter-spacing:0.5px; text-transform:uppercase;
  }
  .count-badge b{ color:var(--text); font-size:15px; font-family: Georgia, serif; }

  .legend-panel{
    position:absolute; bottom:16px; left:16px; z-index:1000;
    background:var(--panel); backdrop-filter: blur(10px);
    border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; color:var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    max-height: 62vh; overflow-y:auto;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    width: 230px;
  }
  .legend-panel::-webkit-scrollbar{ width:5px; }
  .legend-panel::-webkit-scrollbar-thumb{ background:#ffffff30; border-radius:4px; }

  .legend-title{
    font-size:10px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--text-dim); margin-bottom:10px; display:flex; justify-content:space-between;
  }
  .gradient-bar{
    height:6px; border-radius:3px; margin-bottom:10px;
    background: linear-gradient(to right, var(--old), var(--mid), var(--new));
  }
  .legend-item{
    display:flex; align-items:center; gap:8px; padding:4px 0;
    font-size:12.5px; cursor:pointer; border-radius:5px; transition: background 0.15s;
  }
  .legend-item:hover{ background:#ffffff10; }
  .legend-item.dim{ opacity:0.35; }
  .swatch{
    width:11px; height:11px; border-radius:50%; flex-shrink:0;
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
  }
  .legend-item .count{
    margin-left:auto; color:var(--text-dim); font-size:10.5px;
  }

  .leaflet-popup-content-wrapper{
    background: #161b2c; color: var(--text); border-radius: 8px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .leaflet-popup-tip{ background:#161b2c; }
  .popup-name{ font-family: Georgia, serif; font-size:14px; font-weight:600; margin-bottom:3px; }
  .popup-folder{ font-size:11px; color:#a9b0c4; }

  @media (max-width: 640px){
    .title-panel{ max-width: 220px; padding:12px 14px; }
    .title-panel h1{ font-size:16px; }
    .legend-panel{ width:190px; max-height:40vh; }
  }

    color: rgba(255,255,255,0.055); font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px; font-weight: 700; font-style: italic; text-align: center;

  }
</style>
</head>

// gradient interpolation across 3 anchor colors (old -> mid -> new)
function hexToRgb(hex){
  const v = parseInt(hex.slice(1), 16);
  return [(v>>16)&255, (v>>8)&255, v&255];
}
function lerp(a,b,t){ return a + (b-a)*t; }
function colorAt(t){
  const old = hexToRgb('#2e2a6b');
  const mid = hexToRgb('#c23b6b');
  const neu = hexToRgb('#f2a93b');
  let c1, c2, tt;
  if (t < 0.5){ c1 = old; c2 = mid; tt = t/0.5; }
  else { c1 = mid; c2 = neu; tt = (t-0.5)/0.5; }
  const r = Math.round(lerp(c1[0], c2[0], tt));
  const g = Math.round(lerp(c1[1], c2[1], tt));
  const b = Math.round(lerp(c1[2], c2[2], tt));
  return `rgb(${r},${g},${b})`;
}

const folderColors = folders.map((f, i) => colorAt(i / (folders.length - 1)));

const map = L.map('map', { preferCanvas:true, worldCopyJump:true }).setView([30, 10], 3);

// Griglia geografica disegnata nativamente (nessuna dipendenza da server esterni,
// niente watermark, funziona anche offline e in stampa)
function drawGraticule(map){
  const thin = { color:'#ffffff', weight:0.7, opacity:0.06, interactive:false };
  const strong = { color:'#ffffff', weight:1.1, opacity:0.12, interactive:false };
  for (let lon=-180; lon<=180; lon+=15){
    L.polyline([[-85,lon],[85,lon]], lon===0 ? strong : thin).addTo(map);
  }
  for (let lat=-75; lat<=75; lat+=15){
    L.polyline([[lat,-180],[lat,180]], lat===0 ? strong : thin).addTo(map);
  }
  const regionLabels = [
    ["EUROPA", 54, 15], ["AFRICA", -6, 18], ["SUD AMERICA", -20, -58],
    ["NORD AMERICA", 45, -100], ["MEDIO ORIENTE", 24, 48],
    ["ASIA", 45, 90], ["OCEANIA", -24, 135]
  ];
  regionLabels.forEach(([name, lat, lon]) => {
    L.marker([lat, lon], {
      icon: L.divIcon({ className:'region-label', html:name, iconSize:[320,40], iconAnchor:[160,20] }),
      interactive:false, keyboard:false
    }).addTo(map);
  });
}
drawGraticule(map);

const layersByFolder = {};
folders.forEach(f => layersByFolder[f] = L.layerGroup().addTo(map));

const bounds = [];
const countsByFolder = {};
folders.forEach(f => countsByFolder[f] = 0);

places.forEach(p => {
  if (p.Latitudine == null || p.Longitudine == null) return;
  const color = folderColors[p.OrderIdx];
  const marker = L.circleMarker([p.Latitudine, p.Longitudine], {
    radius: 4.5,
    fillColor: color,
    color: color,
    weight: 0.5,
    opacity: 0.9,
    fillOpacity: 0.75
  });
  marker.bindPopup(
    `<div class="popup-name">${p.Nome}</div><div class="popup-folder">${p.Cartella.replace('donde estuve > ','')}</div>`
  );
  marker.addTo(layersByFolder[p.TopFolder]);
  bounds.push([p.Latitudine, p.Longitudine]);
  countsByFolder[p.TopFolder]++;
});

document.getElementById('totalCount').textContent = places.length;

if (bounds.length){
  map.fitBounds(bounds, { padding: [40,40] });
}

const legendList = document.getElementById('legendList');
const activeFolders = new Set(folders);

folders.forEach((f, i) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<span class="swatch" style="background:${folderColors[i]}"></span><span>${f}</span><span class="count">${countsByFolder[f]}</span>`;
  item.addEventListener('click', () => {
    if (activeFolders.has(f)){
      activeFolders.delete(f);
      map.removeLayer(layersByFolder[f]);
      item.classList.add('dim');
    } else {
      activeFolders.add(f);
      map.addLayer(layersByFolder[f]);
      item.classList.remove('dim');
    }
  });
  legendList.appendChild(item);
});
